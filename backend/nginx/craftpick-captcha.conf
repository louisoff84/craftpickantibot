# /etc/nginx/sites-available/craftpick-captcha
#
# Cette première configuration écoute en HTTP.
# Certbot ajoutera automatiquement le bloc HTTPS et la redirection.

server {
    listen 80;
    listen [::]:80;

    server_name captcha-api.craftpick.fr;

    client_max_body_size 32k;

    access_log /var/log/nginx/craftpick-captcha.access.log;
    error_log  /var/log/nginx/craftpick-captcha.error.log;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # On écrase cette valeur au lieu de faire confiance à un en-tête
        # X-Forwarded-For fourni directement par un visiteur.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;

        proxy_buffering off;
        proxy_request_buffering on;
    }

    location = /health {
        proxy_pass http://127.0.0.1:3000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        access_log off;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
